name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "front/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: "front/yarn.lock"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build project
        run: yarn build

      - name: Add the cheat patcher the page runs
        working-directory: .
        run: python3 vp2_cheats.py --web-bundle front/dist/cheats

      - name: Add the newest published web patch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p front/dist/patch patch-assets
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --pattern 'web-patch-*.zip' --dir patch-assets; then
              echo "web patch from $tag"
              break
            fi
          done
          for archive in patch-assets/*.zip; do
            [ -e "$archive" ] && unzip -q -o "$archive" -d front/dist/patch
          done
          python3 tools/web_patch.py index front/dist/patch

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "front/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
