name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Regression suite
        run: python -m unittest discover -s tests -q
      - name: Language packs are well formed
        run: |
          for pack in translations/[!_]*/; do
            python vp2_translate.py check-pack "$pack"
          done

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows
            suffix: windows-x64
            extension: .zip
          - os: ubuntu-24.04
            name: Linux
            suffix: linux-x64
            extension: .tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.11.9'
      - name: Install PyInstaller
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.2"

      - name: Resolve version
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller data/vp2_tools.spec \
            --workpath workspace/internal/build --clean --noconfirm

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          binary="ValkyrieProfile2-Tools"
          ./dist/"${binary}.exe" --self-check
          name="${binary}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}"
          mv "dist/${binary}.exe" "dist/${name}.exe"
          7z a -tzip "${name}.zip" "./dist/${name}.exe" > /dev/null

      - name: Build and package Linux through the release container
        if: runner.os == 'Linux'
        run: |
          docker build \
            --target artifact \
            --build-arg VERSION="${{ steps.package.outputs.version }}" \
            --output type=local,dest=. \
            .

      - name: Show packages
        shell: bash
        run: ls -l ValkyrieProfile2-*${{ matrix.extension }}

      - name: Unpack what will be published
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p roundtrip && cd roundtrip
          for archive in ../ValkyrieProfile2-*.zip; do
            7z x "$archive" > /dev/null
          done
          binaries=(./*.exe)
          test "${#binaries[@]}" -eq 1
          for binary in "${binaries[@]}"; do
            "$binary" --self-check
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vp2-tools-${{ matrix.suffix }}
          path: ValkyrieProfile2-*${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what is being published
        run: ls -l artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
